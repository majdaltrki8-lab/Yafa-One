<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>يافع ون | Yafa One</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #08614f 0%, #064b3d 60%, #032b23 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .logo-container {
      width: 140px;
      height: 140px;
      margin-bottom: 24px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(238, 218, 176, 0.35);
      background: #064b3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #eedab0;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 14px;
      color: #b8ded3;
      margin-bottom: 28px;
      font-weight: 500;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #eedab0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      color: #e2f1ec;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .footer {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
    }
  </style>
  <script>
    const APP_ENDPOINT = 'https://ais-dev-wyfhgmprvy5tciy3ynscos-623825382652.europe-west1.run.app';
    
    window.addEventListener('DOMContentLoaded', () => {
      // If loaded as local fallback inside Capacitor, navigate smoothly to live instance
      setTimeout(() => {
        try {
          if (window.location.href.indexOf(APP_ENDPOINT) === -1) {
            window.location.replace(APP_ENDPOINT);
          }
        } catch (e) {
          console.error('Navigation error:', e);
        }
      }, 300);
    });
  </script>
</head>
<body>
  <div class="logo-container">
