name: Build Yafa One Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Yafa One Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify Project Files
        run: |
          test -f package.json
          test -f bun.lock
          test -f capacitor.config.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Capacitor
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Check TypeScript
        run: bun run lint

      - name: Build Next.js Application
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          npm run build

      - name: Prepare Android & Brand Assets
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi
          bunx cap sync android
          node scripts/setup-android-icons.mjs

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Verify Android Project
        run: |
          test -f android/gradlew
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -d android/app

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK build completed"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yafa-one-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Verify AAB
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          echo "AAB build completed"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: yafa-one-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
