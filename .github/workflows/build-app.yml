steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor CLI & Android Runtime
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      # 1. بناء تطبيق الويب أولاً لتوليد الملفات المطلوبة
      - name: Build Web App
        run: npm run build

      # 2. إضافة منصة الأندرويد والمزامنة بعد توفر ملفات البناء
      - name: Add and Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yafa-one-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
