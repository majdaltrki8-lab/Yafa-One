name: Build Yafa One APK

on:
  push:
    branches:
      - main # أو master حسب اسم الفرع الرئيسي لديك
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. استنساخ الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. تثبيت حزم npm
      - name: Install dependencies
        run: npm ci

      # 4. بناء تطبيق Next.js / Web Assets
      - name: Build Web App
        run: npm run build

      # 5. مزامنة الملفات مع Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 6. إعداد بيئة Java (JDK 17) لبناء أندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 7. منح صلاحية التشغيل لملف Gradle Wrapper
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 8. تجميع ملف الـ APK (Debug)
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # 9. رفع ملف الـ APK كناتج (Artifact) لتحميله بسهولة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yafa-One-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
