
name: Build Yafa One Android APK & AAB
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    name: Build Yafa One Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify Project Files
        run: |
          test -f package.json
          test -f bun.lock
          test -f capacitor.config.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bun run lint

      - name: Build Next.js Application
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: npm run build

      - name: Prepare Android & Brand Assets
        run: |
          node scripts/build-standalone.mjs
          if [ ! -d android ]; then
            bunx cap add android
          fi
          bunx cap sync android
          node scripts/setup-android-icons.mjs

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Verify Android Project
        run: |
          test -f android/gradlew
          test -d android/app
          test -f android/settings.gradle || test -f android/settings.gradle.kts

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify Debug APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "Debug APK created"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yafa-one-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Validate Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing signing secret: $key"
              exit 1
            fi
          done

      - name: Restore Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks

      - name: Build Signed Release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -s "$KEYSTORE_FILE"
          cd android
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify Release AAB
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          echo "Release AAB created"

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: yafa-one-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
