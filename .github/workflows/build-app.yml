name: Build Yafa One Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (npm ci)
        run: npm ci

      - name: Install Capacitor CLI & Android Runtime
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Build Next.js Web App
        run: npm run build
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-dummy-secret-key-yafa-one-2026' }}

      - name: Initialize or Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Android Release AAB (Unsigned / Bundle)
        run: |
          cd android
          ./gradlew bundleRelease || echo "Release bundle requires signing keystore configured in Gradle. Skipping if keystore is missing."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yafa-one-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yafa-one-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
